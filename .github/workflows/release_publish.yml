name: "Release: Publish (TEST)"
run-name: "TEST: Multi-platform build"

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: Specify a tag to build from.

permissions:
  contents: read

jobs:
  PreRelease:
    uses: jericht/.github-aws-deadline/.github/workflows/reusable_maturin_prerelease.yml@jericht/reusable-maturin-build
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}

  VerifyArtifacts:
    needs: PreRelease
    runs-on: ubuntu-latest
    steps:
      - name: Download build-artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: build-artifact/dist

      - name: Install tree
        run: sudo apt-get install -y tree

      - name: Show artifact layout
        run: |
          echo "=== build-artifact layout ==="
          tree build-artifact/
          echo ""
          echo "=== file details ==="
          ls -la build-artifact/dist/
